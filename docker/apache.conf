# No mostrar la versión de Apache ni del sistema operativo.
ServerTokens Prod
ServerSignature Off

# Todo lo que entra por HTTP se redirige a HTTPS.
<VirtualHost *:80>
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/bramajo/public

    SSLEngine on
    SSLCertificateFile /var/www/bramajo/claves/ssl.crt
    SSLCertificateKeyFile /var/www/bramajo/claves/ssl.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/bramajo/public>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
